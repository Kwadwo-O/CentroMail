{% extends "_auth_shell.html" %}
{% block title %}Welcome Back{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block card %}
<h1 id="title">Welcome back</h1>
    <a class="chip" href="{{ url_for('change_email') }}" title="Use different email">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5Z"/></svg>
        <span>{{ email }}</span>
        <svg class="chip-x" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="m7 7 10 10M17 7 7 17"/></svg>
    </a>

    <form method="post" class="form-login">
        <input type="email" value="{{ email }}" autocomplete="username" hidden>
        <div class="field">
            <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required autofocus>
            <label for="password">Password</label>
            <span class="outline" aria-hidden="true"></span>

        </div>

        <button class="btn" type="submit">
            <span>Sign in</span>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </button>
    </form>

{% endblock %}
