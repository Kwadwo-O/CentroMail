{% macro sender_avatar(message, class_name) -%}
{% set logo = sender_logo_url(message.email|default('')) %}
{% set fallback = sender_logo_url(message.email|default(''), local_only=true) %}
<div class="{{ class_name }}{% if logo %} has-sender-logo{% endif %}" aria-hidden="true">
    <span class="sender-initials">{{ message.sender[:2]|upper }}</span>
    {% if logo %}<img class="sender-logo" src="{{ logo }}" {% if fallback and fallback != logo %}data-logo-fallback="{{ fallback }}"{% endif %} alt="" width="40" height="40" loading="lazy" decoding="async" referrerpolicy="origin">{% endif %}
</div>
{%- endmacro %}
