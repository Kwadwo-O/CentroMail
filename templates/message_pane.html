<article class="reader-message">
    <header class="reader-message-header">
        <div class="reader-sender-avatar" aria-hidden="true">{{ message.sender[:2]|upper }}</div>
        <div class="reader-sender"><strong>{{ message.sender }}</strong><span>{{ message.email }}</span></div>
        <time>{{ message.date or message.time }}</time>
    </header>
    <h1 class="reader-subject">{{ message.subject }}</h1>
    {% if message.body is mapping and message.body.html %}
    <iframe class="email-body-frame" title="Email content" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" srcdoc="<!doctype html><html><head><meta name='viewport' content='width=device-width, initial-scale=1'><meta http-equiv='Content-Security-Policy' content=&quot;default-src 'none'; img-src https: http: data:; style-src 'unsafe-inline'; font-src https:; form-action 'none'&quot;><base target='_blank'><style>html{color-scheme:light}body{margin:0;padding:16px;font:15px/1.6 Arial,sans-serif;color:#202124;background:#fff;overflow-wrap:anywhere}img{max-width:100%;height:auto}table{max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#1a73e8}blockquote{margin-inline:12px;padding-left:12px;border-left:3px solid #ddd}@media(max-width:600px){body{padding:12px}table,td{max-width:100%!important}img{max-width:100%!important;height:auto!important}}</style></head><body>{{ message.body.html }}</body></html>"></iframe>
    {% else %}
    <div class="reader-plain-body">{{ message.body.text if message.body is mapping else message.body }}</div>
    {% endif %}
</article>
