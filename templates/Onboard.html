{% extends "_auth_shell.html" %}
{% block title %}Welcome to Centro Mail{% endblock %}
{% block body_class %}page-start{% endblock %}
{% block card %}
<h1 id="title">Start with your email</h1>
<p class="lede">We'll handle everything from here</p>

<form method="post" action="{{ url_for('continue_flow') }}" class="form" novalidate>
    <div class="field">
        <input id="email" type="email" value="{{ email }}" placeholder=" "
            autocomplete="email" inputmode="email" required autofocus>
        <label for="email">Email Address</label>
        <span class="outline" aria-hidden="true"></span>
    </div>

    <button class="btn" type="button">
        <span>Continue</span>
        <svg viewBox="0 0 24 24" width="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6"></path></svg>
    </button>
</form>
{% endblock %}
