{% extends "base.html" %}
{% block title %}{{ message.subject }} | CentroMail{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/mail.css') }}">{% endblock %}
{% block content %}
<section class="message-page">

        <a class="reader-back" href="{{ url_for('inbox', folder=folder) }}"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>Back to {{ folder_title }}</a>

    {% include 'message_pane.html' %}
</section>
{% endblock %}
