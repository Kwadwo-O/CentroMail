{% extends "base.html" %}
{% block title %}Settings | CentroMail{% endblock %}

{% block content %}
<section class="settings-page">
    <div class="form-card">
        <h1>Account settings</h1>

        <div class="settings-list">
            <div class="setting-item">
                <span>Account</span>
                <strong>{{ g.user.email }}</strong>
            </div>
            <div class="setting-item">
                <span>Name</span>
                <strong>{{ g.user.name or g.user.email }}</strong>
            </div>
            <div class="setting-item">
                <span>Security</span>
                <strong>Password sign-in</strong>
            </div>
        </div>
    </div>
</section>
{% endblock %}
