{% extends "_auth_shell.html" %}
{% block title %} Start Today · CentroMail{% endblock %}
{% block body_class %}page-register{% endblock %}
{% block card %}
<h1 id="title">Start today</h1>

<div class="chip">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5Z"/></svg>
  <span>{{ email }}</span>
</div>

<form method="post" class="form">
  <input type="email" name="email" value="{{ email }}" autocomplete="username" hidden>
  <div class="field">
    <input id="name" name="name" type="text" value="{{ name }}" placeholder=" "
           autocomplete="name" required autofocus>
    <label for="name">Your name</label>
    <span class="outline" aria-hidden="true"></span>
  </div>

  <div class="field">
    <input id="password" name="password" type="password" placeholder=" "
           autocomplete="new-password" minlength="8" required>
    <label for="password">Password</label>
    <span class="outline" aria-hidden="true"></span>
    <p class="support">At least 8 characters.</p>
  </div>

  <button class="btn" type="submit">
    <span>Create account</span>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6 6 6-6 6"/></svg>
  </button>
</form>
{% endblock %}
